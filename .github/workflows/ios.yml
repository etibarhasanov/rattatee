name: build

# Builds the app for the simulator when asked, so a change that does not
# compile is caught here rather than the next time someone opens Xcode. The
# same arrangement as Kohuke's workflow, which this is copied from.

# The screenshots below are pushed to the ci-screens branch, which needs
# write access to the repository's contents.
permissions:
  contents: write

# Switched off on 2026-11-18: it ran on every push and every pull request,
# about twenty minutes of a macOS runner each, and failed once in sixty runs.
# It now runs only when somebody asks: Actions -> build -> Run workflow, on
# the branch to check. Press it before a release or after a change to how the
# app looks, when the screenshots are worth having. To turn it back on, put
# the push and pull_request triggers back above workflow_dispatch.
on:
  workflow_dispatch:

# A newer push to the same branch makes the older build moot. Packages are
# made by release.yml, only when asked, and never here.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The app's words come in four languages. A key missing one of them is
      # a sentence that falls back to English in the middle of an Estonian
      # screen; a key the code asks for and the file lacks is a screen that
      # prints the key.
      - name: Check the app's strings
        run: |
          python3 - <<'PY'
          import glob, json, re, sys
          strings = json.load(open('Rattatee/Seed/strings.json'))
          bad = [k for k, v in strings.items() if sorted(v) != ['az', 'en', 'et', 'ru'] or not all(v.values())]
          if bad:
              sys.exit('strings.json: not in all four languages: ' + ', '.join(bad))
          source = ''.join(open(f).read() for f in glob.glob('Rattatee/**/*.swift', recursive=True))
          used = set(re.findall(r'L\.t\("(\w+)"', source))
          if used - set(strings):
              sys.exit('asked for in the code and not in strings.json: ' + ', '.join(sorted(used - set(strings))))
          if set(strings) - used:
              sys.exit('in strings.json and never asked for: ' + ', '.join(sorted(set(strings) - used)))
          print(len(strings), 'strings, each in az, en, et and ru, each used')
          PY

      - name: Show the selected Xcode
        run: xcodebuild -version

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          build=(xcodebuild build
            -project Rattatee.xcodeproj
            -scheme Rattatee
            -destination 'generic/platform=iOS Simulator'
            -configuration Debug
            -derivedDataPath build
            CODE_SIGNING_ALLOWED=NO)
          # xcbeautify ships with the runner image, but the build must not fail
          # merely because a future image drops it.
          if command -v xcbeautify >/dev/null 2>&1; then
            "${build[@]}" | xcbeautify --renderer github-actions
          else
            "${build[@]}"
          fi

      # The keys App Store review reads, and the one the app cannot work
      # without: the background mode that keeps a ride recording in a pocket.
      - name: Check the generated Info.plist
        shell: bash
        run: |
          set -euo pipefail
          app=build/Build/Products/Debug-iphonesimulator/Rattatee.app
          plist=$app/Info.plist
          echo "--- Info.plist ---"
          plutil -p "$plist"

          fail=0
          check() {
            if plutil -p "$plist" | grep -q "$2"; then
              echo "ok: $1"
            else
              echo "::error::$1 is missing from the built Info.plist"
              fail=1
            fi
          }
          check "display name"        '"CFBundleDisplayName" => "Rattatee"'
          check "bundle id"           '"CFBundleIdentifier" => "ee.tallinntastebuds.rattatee"'
          check "encryption answer"   '"ITSAppUsesNonExemptEncryption"'
          check "launch screen colour" '"UIColorName" => "LaunchPaper"'
          check "location permission" '"NSLocationWhenInUseUsageDescription"'
          check "background location" '0 => "location"'
          check "background audio"    '1 => "audio"'
          for f in PrivacyInfo.xcprivacy strings.json et.lproj/InfoPlist.strings ru.lproj/InfoPlist.strings az.lproj/InfoPlist.strings az-left.m4a en-left.m4a; do
            if [ -e "$app/$f" ]; then echo "ok: $f is in the bundle"; else echo "::error::$f is missing from the bundle"; fail=1; fi
          done
          exit $fail

      # Nobody can look at a simulator from a cloud session, and a simulator
      # cannot go for a bike ride, so the app is launched here in each state
      # worth seeing and photographed. LaunchScript.swift reads the
      # arguments and stages a ride that is never written or sent. The
      # pictures are the run's "screens" artifact; nothing about them can
      # fail the build except the simulator itself not starting.
      - name: Photograph the screens
        shell: bash
        run: |
          set -euo pipefail
          app=build/Build/Products/Debug-iphonesimulator/Rattatee.app
          bundle=ee.tallinntastebuds.rattatee
          dev=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          plain = [x for x in phones if x["name"] in ("iPhone 16", "iPhone 15")]
          print((plain or phones)[0]["udid"])')
          xcrun simctl boot "$dev"
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl status_bar "$dev" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$dev" "$app"
          # So the map shows where the phone is rather than the question.
          xcrun simctl privacy "$dev" grant location "$bundle" || true
          xcrun simctl location "$dev" set 59.4370,24.7536 || true
          mkdir -p screens
          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$dev" "$bundle" >/dev/null 2>&1 || true
            xcrun simctl launch "$dev" "$bundle" "$@" >/dev/null
            sleep 12
            xcrun simctl io "$dev" screenshot "screens/$name.png" >/dev/null
            echo "photographed $name"
          }
          shot 01-ready
          shot 02-recording -kDemo recording
          shot 03-paused -kDemo paused
          shot 04-save -kDemo save
          shot 05-too-short -kDemo short
          shot 06-saved -kDemo saved
          shot 07-kept -kDemo kept
          shot 08-rides -kDemo rides -kTab 1
          # Search and go. The search asks the live site, as the app does.
          shot 16-goal -kDemo goal
          shot 17-going -kDemo going
          shot 18-search -kSheet search
          shot 09-rides-empty -kDemo none -kTab 1
          shot 10-account -kTab 2 -kDoors YES
          # The other two languages, and the night style.
          shot 11-recording-et -kDemo recording -AppleLanguages '(et)'
          shot 12-save-ru -kDemo save -AppleLanguages '(ru)'
          shot 13-rides-et -kDemo rides -kTab 1 -AppleLanguages '(et)'
          shot 23-going-az -kDemo going -AppleLanguages '(az)'
          # The colours: each of the four, light and dark.
          shot 19-red-light -kDemo save -hue red
          shot 20-plum-light -kDemo going -hue plum
          shot 21-account-dark -kTab 2 -kDoors YES -look dark -hue green
          shot 22-blue-dark -kDemo recording -look dark
          xcrun simctl ui "$dev" appearance dark
          shot 14-recording-dark -kDemo recording
          shot 15-rides-dark -kDemo rides -kTab 1

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens
          if-no-files-found: ignore

      # The same pictures, shrunk, on a branch of their own, because a git
      # fetch reaches a cloud session where an artifact download does not.
      # One orphan commit, force-pushed over the last, so the branch never
      # grows; it carries the screens of whichever branch pushed last.
      - name: Publish the screens to the ci-screens branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          for f in screens/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 70 "$f" --out "$out/$(basename "${f%.png}").jpg" >/dev/null
          done
          echo "${GITHUB_REF_NAME} @ ${GITHUB_SHA}" > "$out/FROM.txt"
          cd "$out"
          git init -q -b ci-screens
          git add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Screens of ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
