<!-- The app icon, drawn: the owner's own bike on the Estonian flag.

     The flag is the three bands at their true colours — blue #0072ce,
     black, white — and the top of the black band is cut into Tallinn as it
     stands seen from the harbour, left to right: Fat Margaret's cone, St
     Nicholas' stepped spire, Alexander Nevsky's domes, the Dome Church on
     Toompea, the red-and-white chimney and Oleviste's spire. The skyline
     is pressed to six tenths of its height so Oleviste fits under the top
     edge; it is a silhouette, so nothing but the outline has to be true.

     The bike is the blue single-speed — blue all over, top tube included,
     black fork and riser bar, the red clip-on mudguard off the seat post —
     drawn from a photograph of it side on. Its tyres, fork and bar are
     black on a black band, so the whole bike carries a white outline (the
     dilate filter); the spokes are drawn outside it, or the outline fills
     the wheels in.

     The bike sits across the black band on purpose: blue frame on black is
     the strongest contrast the flag has, and at the home screen's 60 px the
     bike and the three bands are what read.
     Rattatee/Assets.xcassets/AppIcon.appiconset/icon-1024.png is this page
     photographed at 1024 × 1024; README.md says how. -->
