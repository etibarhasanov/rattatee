<!-- The app icon, drawn: the owner's own bike — the blue single-speed with
     the chipped white top tube, the black fork and riser bar, the tan-wall
     rear tyre and the red clip-on mudguard — leant on the parapet at
     Toompea, with Tallinn behind it the way the two photographs it was
     drawn from see it: the Town Hall's needle spire, the round wall towers
     under red cones, the steep Old Town roofs, the glass towers of the
     centre, the sea line, and Oleviste's copper spire on the right.
     The bike is drawn large on purpose: at the home screen's 60 px the
     skyline turns to texture and the bike is what has to read.
     Rattatee/Assets.xcassets/AppIcon.appiconset/icon-1024.png is this page
     photographed at 1024 × 1024; README.md says how. -->
